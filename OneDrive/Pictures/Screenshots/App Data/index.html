<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
            color: #111827;
        }

        .container {
            background: #ffffff;
            padding: 2.5rem 3rem;
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(17, 24, 39, 0.12);
            text-align: center;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 2.3rem;
        }

        p {
            margin: 0;
            font-size: 1.05rem;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Index Page</h1>
        <p>Your HTML page is ready.</p>
    </div>
</body>
</html>
